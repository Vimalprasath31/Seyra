
name: Build SEYRA Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SEYRA APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository files
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Verify project ZIP
      - name: Check project ZIP
        run: |
          if [ ! -f "SEYRA_Android_Project_No_Workflow.zip" ]; then
            echo "ERROR: SEYRA project ZIP not found!"
            exit 1
          fi

      # 3. Extract Android project
      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q SEYRA_Android_Project_No_Workflow.zip -d extracted

          if [ ! -f "extracted/SEYRA_Android/app/build.gradle" ]; then
            echo "ERROR: Android project structure is incorrect!"
            exit 1
          fi

          echo "Android project extracted successfully."

      # 4. Configure Java 17
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 5. Configure Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 6. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 7. Build Android APK
      - name: Build Debug APK
        working-directory: extracted/SEYRA_Android
        run: |
          gradle --no-daemon assembleDebug

      # 8. Verify APK exists
      - name: Verify APK
        run: |
          APK="extracted/SEYRA_Android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK generated successfully!"
          ls -lh "$APK"

      # 9. Upload APK to GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEYRA-Android-debug-APK
          path: extracted/SEYRA_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
