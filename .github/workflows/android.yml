
name: Build SEYRA Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SEYRA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f SEYRA_Android_Project_No_Workflow.zip

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q SEYRA_Android_Project_No_Workflow.zip -d extracted
          ls -la extracted/SEYRA_Android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: extracted/SEYRA_Android
        run: |
          gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          ls -lh extracted/SEYRA_Android/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEYRA-Android-debug-APK
          path: extracted/SEYRA_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
